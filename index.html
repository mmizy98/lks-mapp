<style>
/* Dark single-theme look matching the BMSTU student portal (lks.bmstu.ru): black ground, deep-blue header band, bright blue accents, rounded cards. */
:root{
  --bg:#000; --surface:#0d0d0f; --card:#141417; --fg:#f2f4f8; --muted:#8f97a6; --line:#25272d;
  --brand:#0a52ad; --accent:#1e6fe0; --accent-hi:#3d8bff; --accent-fg:#fff; --soft:#0c2346; --warn:#ffb067;
  --route:#3d8bff; --start:#2fbf71; --end:#ff5a4e;
  --map:#060708; --bld:#0e1117; --bld-line:#2a3140; --room:#13284a; --wall:#7d8fb3; --room-line:#245ab8; --hall:#1f2a3d; --svc:#121620;
  --sans:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:Montserrat,system-ui,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gx2:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.band{padding-left:var(--gx);padding-right:var(--gx2)}
#top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:10px;background:var(--brand)}
#top .brand{display:flex;align-items:center;gap:10px;min-width:0}
#top .logo{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-weight:800;font-size:8.5px;letter-spacing:0}
#top>div:first-child{min-width:0}
#top .seg{flex:none}
#top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top small{display:block;color:rgba(255,255,255,.75);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;flex:none;background:rgba(0,0,0,.35);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:rgba(255,255,255,.75);border-radius:8px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#panel{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;position:relative;z-index:5}
.fields{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.field{position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.field label{width:46px;color:var(--muted);font-size:12px;flex:none}
.field input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-weight:600;font-size:15px}
.field input::placeholder{color:#5d6472;font-weight:500}
.field input:focus{border-color:var(--accent)}
.fields .swap{grid-column:2;grid-row:1 / span 2;align-self:center}
.ibtn{height:42px;min-width:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;padding:0 10px;color:var(--accent-hi);font-size:17px}
.ibtn:hover{border-color:var(--accent)}
#sug{position:absolute;left:calc(var(--gx) + 54px);right:calc(var(--gx2) + 54px);top:100%;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.6);max-height:40vh;overflow:auto;z-index:20}
#sug li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#sug li:hover,#sug li[aria-selected="true"]{background:var(--soft)}
#sug b{font-weight:700}
#sug span{color:var(--muted);font-size:12px}
.note{margin:8px 0 0;color:var(--muted);font-size:12px}
.note.warn{color:var(--warn)}
#tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#tools button{flex:none;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
#tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#editrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
#editrow input{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-family:var(--mono);flex:1;min-width:120px}
#editrow .small{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
#editrow .danger{color:var(--end)}
#dump{width:100%;height:90px;margin-top:8px;font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg)}
#map{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--map);cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#plan{display:block;max-width:none!important;pointer-events:none;-webkit-user-drag:none;filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(1.08)}
#map.vec #plan{opacity:0}
#map.vec.edit #plan{opacity:.32}
#vec{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#map.vec.edit #vec{opacity:.55}
#vec .rm text{font-family:var(--sans);font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
#ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#ov .rcase{fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round}
#ov .rline{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
#ov text{font-family:var(--sans);font-weight:700;paint-order:stroke;stroke:#000;stroke-linejoin:round;fill:#fff}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
#legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;align-items:center;gap:4px;background:rgba(13,13,15,.88);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted)}
#legend span{display:inline-block;width:12px;height:12px;border-radius:3px}
#legend .lg-st{border:1.5px solid #ff9a3d;background:repeating-linear-gradient(#1f1812 0 2px,#ff9a3d 2px 3px)}
#legend .lg-lf{border:1.5px solid #2bc4bd;background:#0f2224}
#legend .lg-en{border:1.5px solid #2fbf71;border-radius:50%;background:#0d2a1a}
#legend .lg-wc{border:1.5px solid #8b78ff;background:#211a36}
#legend>span{margin-left:8px}
#legend i{display:inline-flex;gap:2px}
#loading{position:absolute;left:12px;top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:12px}
#sheet{background:var(--surface);border-top:1px solid var(--line);max-height:30%;overflow:auto;padding-block:8px}
#sheet h2{margin:0 0 6px;font-size:16px;font-weight:700;color:var(--accent-hi)}
#steps{margin:0;padding:0;list-style:none;display:grid;gap:2px}
#steps li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:500}
#steps li:hover{background:var(--soft)}
#steps .fl{flex:none;min-width:34px;font-weight:800;color:var(--accent-hi)}
#steps .up{color:var(--muted);cursor:default}
/* floors: vertical «elevator» column over the map, away from the iPhone home-indicator edge */
#floors{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;max-height:calc(100% - 62px);z-index:4;display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding:5px;background:rgba(13,13,15,.85);border:1px solid var(--line);border-radius:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#floors::-webkit-scrollbar{display:none}
#floors .lab{flex:none;color:var(--muted);font-size:10px;font-weight:600;text-align:center;padding:2px 0}
#floors button{flex:none;position:relative;width:44px;min-height:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:700}
#floors button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#floors button.has::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--route);box-shadow:0 0 0 2px var(--card)}
#floors button[aria-pressed="true"].has::after{background:#fff;box-shadow:0 0 0 2px var(--accent)}
#floors button.empty{color:var(--muted);font-weight:400}
@media (prefers-reduced-motion:no-preference){#stage{transition:none}}
</style>

<div id="app">
  <header id="top" class="band">
    <div class="brand"><span class="logo" aria-hidden="true">МГТУ</span><h1>Карта УЛК<small>учебно-лабораторный корпус</small></h1></div>
    <div class="seg" role="group" aria-label="Режим">
      <button id="mView" aria-pressed="true">Маршрут</button>
      <button id="mEdit" aria-pressed="false">Редактор</button>
    </div>
  </header>

  <section id="panel" class="band">
    <div id="viewPanel">
      <div class="fields">
        <div class="field"><label for="inFrom">Откуда</label><input id="inFrom" autocomplete="off" inputmode="text" placeholder="вход или аудитория"></div>
        <button class="ibtn swap" id="swap" title="Поменять местами" aria-label="Поменять местами">⇅</button>
        <div class="field"><label for="inTo">Куда</label><input id="inTo" autocomplete="off" inputmode="text" placeholder="номер аудитории, например 403"></div>
      </div>
      <ul id="sug" role="listbox" hidden></ul>
      <p class="note warn" id="viewNote"></p>
    </div>
    <div id="editPanel" hidden>
      <div id="tools" role="group" aria-label="Инструменты"></div>
      <p class="note" id="hint"></p>
      <div id="editrow">
        <input id="lbl" placeholder="подпись точки" autocomplete="off" hidden>
        <button class="small" id="lblOk" hidden>Готово</button>
        <button class="small" id="newLine" hidden>Новая линия</button>
        <button class="small" id="copyJson">Копировать данные</button>
        <button class="small danger" id="resetFloor">Сбросить этаж</button>
      </div>
      <p class="note" id="status"></p>
      <textarea id="dump" hidden readonly aria-label="Данные разметки"></textarea>
    </div>
  </section>

  <main id="map" aria-label="План этажа">
    <div id="stage"><img id="plan" alt="План этажа" draggable="false"><svg id="vec"></svg><svg id="ov"></svg></div>
    <div id="loading">Загружаю план…</div>
    <div id="legend" aria-hidden="true"><i><span class="lg-st"></span><span class="lg-lf"></span><span class="lg-st"></span></i> лестницы и лифтовый холл <span class="lg-wc"></span> туалет <span class="lg-en"></span> вход</div>
    <nav id="floors" aria-label="Этажи"></nav>
    <div class="zoom">
      <button id="zIn" aria-label="Приблизить">+</button>
      <button id="zOut" aria-label="Отдалить">−</button>
      <button id="zFit" aria-label="Показать весь этаж">⤢</button>
    </div>
  </main>

  <section id="sheet" class="band" hidden>
    <h2>Маршрут</h2>
    <ol id="steps"></ol>
  </section>

</div>

  FLOORS.forEach(function(f){G[f]=SEED&&SEED[f]?clone(SEED[f]):{nodes:[],edges:[]}});
  try{var raw=localStorage.getItem(LS); if(raw){var o=JSON.parse(raw); Object.keys(o).forEach(function(f){if(G[f])G[f]=o[f]})}}catch(e){}
}
function markDirty(f){
  dirty[f]=1;
  try{localStorage.setItem(LS,JSON.stringify(G))}catch(e){}
  setStatus('Сохраняю…');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
function flush(){
  var fs=Object.keys(dirty); dirty={};
  if(!dbRef){setStatus('Сохранено на этом устройстве'); return}
  Promise.all(fs.map(function(f){return dbRef.doc('ulk/f'+f).set({nodes:G[f].nodes,edges:G[f].edges,rev:Date.now()})}))
    .then(function(){setStatus('Сохранено')})
    .catch(function(){setStatus('Сохранено на этом устройстве (общее хранилище недоступно)')});
}
function setStatus(t){$('#status').textContent=t}
function loadDb(){
  if(!window.claude||!window.claude.use) return;
  window.claude.use('db').then(function(db){
    if(!db) return; dbRef=db;
    return db.collection('ulk').get().then(function(snap){
      var any=false;
      snap.forEach(function(d){var id=d.id; if(id.charAt(0)==='f'){var f=id.slice(1), v=d.data(); if(G[f]&&v&&v.nodes){G[f]={nodes:v.nodes,edges:v.edges||[]}; any=true}}});
      if(any){recompute(); render(); renderFloors()}
    });
  }).catch(function(){});
}

/* ---------- search ---------- */
var MAP={a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};
function norm(s){return String(s).toLowerCase().replace(/ауд\.?/g,'').replace(/[^0-9a-zа-яё]/g,'').replace(/[a-z]/g,function(c){return MAP[c]||c})}
function items(){
  var out=[];
  FLOORS.forEach(function(f){G[f].nodes.forEach(function(n){ if((n.t==='r'||n.t==='e')&&n.l) out.push({key:f+':'+n.id,f:f,n:n,label:n.l,k:norm(n.l)}) })});
  return out;
}
function find(q){
  var nq=norm(q); if(!nq) return [];
  var all=items(), ex=all.filter(function(i){return i.k===nq}), st=all.filter(function(i){return i.k!==nq&&i.k.indexOf(nq)===0}), ct=all.filter(function(i){return i.k.indexOf(nq)>0});
  return ex.concat(st,ct).slice(0,8);
}
var sugField=null, sugList=[], sugIdx=-1;
function showSug(which){
  sugField=which; var q=$(which==='from'?'#inFrom':'#inTo').value;
  sugList=q.trim()?find(q):items().filter(function(i){return i.n.t==='e'}).slice(0,6);
  sugIdx=-1; var ul=$('#sug');
  if(!sugList.length){ul.hidden=true; return}
  ul.innerHTML=sugList.map(function(i,ix){return '<li role="option" data-i="'+ix+'"><b>'+esc(i.label)+'</b><span>'+(i.n.t==='e'?'вход · ':'')+'этаж '+i.f+'</span></li>'}).join('');
  ul.hidden=false;
}
function pick(which,item){
  sel[which]=item; $(which==='from'?'#inFrom':'#inTo').value=item.label; $('#sug').hidden=true; recompute(); autoShow();
}
['from','to'].forEach(function(w){
  var el=$(w==='from'?'#inFrom':'#inTo');
  el.addEventListener('input',function(){sel[w]=null; showSug(w); recompute(); render(); renderFloors()});
  el.addEventListener('focus',function(){showSug(w); el.select()});
  el.addEventListener('keydown',function(e){
    var ul=$('#sug');
    if(e.key==='ArrowDown'&&!ul.hidden){e.preventDefault(); sugIdx=Math.min(sugList.length-1,sugIdx+1); hl()}
    else if(e.key==='ArrowUp'&&!ul.hidden){e.preventDefault(); sugIdx=Math.max(0,sugIdx-1); hl()}
    else if(e.key==='Enter'){ if(sugList.length){pick(w,sugList[Math.max(0,sugIdx)]); el.blur()} }
    else if(e.key==='Escape'){ul.hidden=true}
  });
  el.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==el)$('#sug').hidden=true},180)});
});

  var li=e.target.closest('li'); if(!li) return; e.preventDefault();

$('#swap').addEventListener('click',function(){

/* ---------- routing ---------- */
function buildGraph(){
  var N={}, adj={};
  function add(a,b,w){(adj[a]=adj[a]||[]).push([b,w]); (adj[b]=adj[b]||[]).push([a,w])}
  FLOORS.forEach(function(f){G[f].nodes.forEach(function(n){N[f+':'+n.id]={f:f,n:n}; adj[f+':'+n.id]=adj[f+':'+n.id]||[]})});
  FLOORS.forEach(function(f){
    var g=G[f], by={}; g.nodes.forEach(function(n){by[n.id]=n});
    g.edges.forEach(function(e){var A=by[e[0]],B=by[e[1]]; if(A&&B) add(f+':'+A.id,f+':'+B.id,Math.hypot(A.x-B.x,A.y-B.y))});
    var corr=g.nodes.filter(function(n){return n.t==='c'});
    if(!corr.length) return;
    g.nodes.forEach(function(n){
      if(n.t==='c'||adj[f+':'+n.id].length) return;
      var best=null,bd=1e9; corr.forEach(function(c){var d=Math.hypot(c.x-n.x,c.y-n.y); if(d<bd){bd=d;best=c}});
      if(best) add(f+':'+n.id,f+':'+best.id,bd);
    });
  });
  var groups={};
  FLOORS.forEach(function(f,fi){G[f].nodes.forEach(function(n){ if((n.t==='s'||n.t==='l')&&n.l){var k=n.t+':'+norm(n.l); (groups[k]=groups[k]||[]).push({f:f,fi:fi,id:n.id,t:n.t})}})});
  Object.keys(groups).forEach(function(k){
    var a=groups[k].sort(function(x,y){return x.fi-y.fi});
    for(var i=1;i<a.length;i++) add(a[i-1].f+':'+a[i-1].id,a[i].f+':'+a[i].id,(a[i].t==='l'?70:130)*(a[i].fi-a[i-1].fi));
  });
  return {N:N,adj:adj};
}
function dijkstra(g,s,t){
  var dist={},prev={},done={}; Object.keys(g.adj).forEach(function(k){dist[k]=Infinity}); dist[s]=0;
  var open=[s];
  while(open.length){
    var bi=0; for(var i=1;i<open.length;i++) if(dist[open[i]]<dist[open[bi]]) bi=i;
    var u=open.splice(bi,1)[0]; if(done[u]) continue; done[u]=1; if(u===t) break;
    g.adj[u].forEach(function(e){var v=e[0],nd=dist[u]+e[1]; if(nd<dist[v]){dist[v]=nd;prev[v]=u; open.push(v)}});
  }
  if(dist[t]===Infinity) return null;
  var p=[t]; while(p[0]!==s) p.unshift(prev[p[0]]); return p;
}
function nm(rec){
  var n=rec.n;
  if(n.t==='r') return /^\d/.test(n.l)?'аудитории '+n.l:'«'+n.l+'»';
  if(n.t==='e') return '«'+n.l+'»';
  if(n.t==='s') return n.l&&/^Холл/.test(n.l)?'лифтового холла '+n.l.replace(/\D/g,''):'лестницы «'+n.l+'»';
  if(n.t==='l') return 'лифта «'+n.l+'»';
  return 'коридора';
}
function R0(segs){return segs[0].pts[0]}
function recompute(){
  R=null; var note=$('#viewNote'); note.textContent='';
  if(!sel.from||!sel.to){ var q=$('#inTo').value.trim(); if(q&&!sel.to&&!find(q).length) note.textContent='Аудитории «'+q+'» нет в разметке. Размечены не все этажи.'; renderSheet(); return }
  var g=buildGraph(), a=sel.from.key, b=sel.to.key;
  if(!g.N[a]||!g.N[b]){renderSheet(); return}
  var p=a===b?[a]:dijkstra(g,a,b);
  if(!p){note.textContent='Маршрут не найден: между точками нет связи. Проверьте лестницы и коридоры в редакторе.'; renderSheet(); return}
  var segs=[]; p.forEach(function(k){var r=g.N[k]; var last=segs[segs.length-1]; if(last&&last.f===r.f) last.pts.push(r); else segs.push({f:r.f,pts:[r]})});
  var steps=[];
  segs.forEach(function(s,i){
    var A=s.pts[0],B=s.pts[s.pts.length-1];
    if(i>0){
      var up=FLOORS.indexOf(s.f)>FLOORS.indexOf(segs[i-1].f), last=steps[steps.length-1];
      var t=(up?'Поднимитесь':'Спуститесь')+' на этаж '+s.f+' по лестнице или на лифте'+(A.n.l?' ('+A.n.l.toLowerCase().replace('холл','лифтовый холл')+')':'');
      if(last&&last.up) { last.text=t; last.f=s.f } else steps.push({up:true,text:t,f:s.f});
    }
    if(s.pts.length<2) return;
    steps.push({text:'От '+nm(A)+' до '+nm(B),f:s.f});
  });
  if(!steps.length) steps.push({text:'Вы уже на месте: '+nm(R0(segs)),f:segs[0].f});
  R={path:p,segs:segs,steps:steps,floors:segs.map(function(s){return s.f}),start:g.N[a],end:g.N[b]};
  if(window.ULK_HAPTIC) window.ULK_HAPTIC();
  renderSheet();
}
function renderSheet(){
  var sh=$('#sheet');
  if(!R||!R.steps.length||mode==='edit'){sh.hidden=true; return}
  sh.hidden=false;
  $('#steps').innerHTML=R.steps.map(function(s,i){return '<li'+(s.up?' class="up"':' data-f="'+s.f+'"')+'><span class="fl">'+(s.up?'↑':s.f)+'</span><span>'+esc(s.text)+'</span></li>'}).join('');
}
$('#steps').addEventListener('click',function(e){var li=e.target.closest('li[data-f]'); if(li) setFloor(li.getAttribute('data-f'),true)});

/* ---------- view / transform ---------- */
var map=$('#map'), stage=$('#stage'), plan=$('#plan'), ov=$('#ov'), vsvg=$('#vec'), vecKey='';
function applyView(){stage.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.s+')'; render()}
function vbox(f){
  var V=VEC[f]; if(!V) return null; var b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  function add(x,y,w,hh){b.x0=Math.min(b.x0,x);b.y0=Math.min(b.y0,y);b.x1=Math.max(b.x1,x+w);b.y1=Math.max(b.y1,y+hh)}
  if(V.bb) add(V.bb[0],V.bb[1],V.bb[2]-V.bb[0],V.bb[3]-V.bb[1]); (V.deco||[]).forEach(function(r){add(r.x,r.y,r.w,r.h)}); (V.ent||[]).forEach(function(e){add(e.x-20,e.y-20,40,60)});
  return b;
}
function fitAll(){
  var r=map.getBoundingClientRect(); if(!r.width) return;
  if(VEC[cur]&&(mode==='view'||NOSCAN)){ var b=vbox(cur); if(b){ fitBox(b); return } }
  var s=Math.min(r.width/IW,r.height/IH); view.s=Math.max(s,0.05); view.tx=(r.width-IW*view.s)/2; view.ty=(r.height-IH*view.s)/2; applyView();
}
function fitBox(b){
  var r=map.getBoundingClientRect(), pad=60, w=Math.max(b.x1-b.x0,200)+pad*2, h=Math.max(b.y1-b.y0,200)+pad*2;
  var L=64, R2=56, aw=Math.max(r.width-L-R2,100); // floor column on the left, zoom buttons on the right
  var s=Math.min(aw/w,r.height/h,1.1); view.s=Math.max(s,0.05);
  view.tx=L+aw/2-((b.x0+b.x1)/2)*view.s; view.ty=r.height/2-((b.y0+b.y1)/2)*view.s; applyView();
}
function fitRoute(){
  if(!R) return fitAll();
  var pts=[]; R.segs.forEach(function(s){ if(s.f===cur) s.pts.forEach(function(p){pts.push(p.n)}) });
  if(!pts.length) return fitAll();
  fitBox({x0:Math.min.apply(null,pts.map(function(p){return p.x})),x1:Math.max.apply(null,pts.map(function(p){return p.x})),y0:Math.min.apply(null,pts.map(function(p){return p.y})),y1:Math.max.apply(null,pts.map(function(p){return p.y}))});
}
function zoomAt(cx,cy,f){
  var ns=Math.min(2.2,Math.max(0.05,view.s*f)), ix=(cx-view.tx)/view.s, iy=(cy-view.ty)/view.s;
  view.s=ns; view.tx=cx-ix*ns; view.ty=cy-iy*ns; applyView();
}

  try{tg.setHeaderColor('#0a52ad'); tg.setBackgroundColor('#000000'); if(tg.setBottomBarColor) tg.setBottomBarColor('#0d0d0f')}catch(e){}
  try{if(tg.disableVerticalSwipes) tg.disableVerticalSwipes()}catch(e){}
  document.documentElement.classList.add('in-tg');
  var sp=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';
  if(sp&&window.ULK_OPEN){ // "403", "312a", "from_1101__to_403"
    var m=sp.match(/^from_(.+)__to_(.+)$/); setTimeout(function(){ m?window.ULK_OPEN(m[2],m[1]):window.ULK_OPEN(sp) },50);
  }
  window.ULK_HAPTIC=function(){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}};
})();
</script>
