<style>
/* Dark single-theme look matching the BMSTU student portal (lks.bmstu.ru): black ground, deep-blue header band, bright blue accents, rounded cards. */
:root{
  --bg:#000; --surface:#0d0d0f; --card:#141417; --fg:#f2f4f8; --muted:#8f97a6; --line:#25272d;
  --brand:#0a52ad; --accent:#1e6fe0; --accent-hi:#3d8bff; --accent-fg:#fff; --soft:#0c2346; --warn:#ffb067;
  --route:#3d8bff; --start:#2fbf71; --end:#ff5a4e;
  --map:#060708; --bld:#0e1117; --bld-line:#2a3140; --room:#13284a; --wall:#7d8fb3; --room-line:#245ab8; --hall:#1f2a3d; --svc:#121620;
  --sans:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:Montserrat,system-ui,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gx2:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{padding-left:var(--gx);padding-right:var(--gx2)}
#top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:10px;background:var(--brand)}
#top .brand{display:flex;align-items:center;gap:10px;min-width:0}
#top .logo{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-weight:800;font-size:8.5px;letter-spacing:0}
#top>div:first-child{min-width:0}
#top .seg{flex:none}
#top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top small{display:block;color:rgba(255,255,255,.75);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;flex:none;background:rgba(0,0,0,.35);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:rgba(255,255,255,.75);border-radius:8px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#panel{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;position:relative;z-index:5}
.fields{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.field{position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.field label{width:46px;color:var(--muted);font-size:12px;flex:none}
.field input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-weight:600;font-size:15px}
.field input::placeholder{color:#5d6472;font-weight:500}
.field input:focus{border-color:var(--accent)}
.fields .swap{grid-column:2;grid-row:1 / span 2;align-self:center}
.ibtn{height:42px;min-width:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;padding:0 10px;color:var(--accent-hi);font-size:17px}
.ibtn:hover{border-color:var(--accent)}
#sug{position:absolute;left:calc(var(--gx) + 54px);right:calc(var(--gx2) + 54px);top:100%;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.6);max-height:40vh;overflow:auto;z-index:20}
#sug li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#sug li:hover,#sug li[aria-selected="true"]{background:var(--soft)}
#sug b{font-weight:700}
#sug span{color:var(--muted);font-size:12px}
.note{margin:8px 0 0;color:var(--muted);font-size:12px}
.note.warn{color:var(--warn)}
#tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#tools button{flex:none;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
#tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#editrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
#editrow input{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-family:var(--mono);flex:1;min-width:120px}
#editrow .small{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
#editrow .danger{color:var(--end)}
#dump{width:100%;height:90px;margin-top:8px;font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg)}
#map{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--map);cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#plan{display:block;max-width:none!important;pointer-events:none;-webkit-user-drag:none;filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(1.08)}
#map.vec #plan{opacity:0}
#map.vec.edit #plan{opacity:.32}
#vec{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#map.vec.edit #vec{opacity:.55}
#vec .rm text{font-family:var(--sans);font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
#ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#ov .rcase{fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round}
#ov .rline{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
#ov text{font-family:var(--sans);font-weight:700;paint-order:stroke;stroke:#000;stroke-linejoin:round;fill:#fff}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
#legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;align-items:center;gap:4px;background:rgba(13,13,15,.88);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted)}
#legend span{display:inline-block;width:12px;height:12px;border-radius:3px}
#legend .lg-st{border:1.5px solid #ff9a3d;background:repeating-linear-gradient(#1f1812 0 2px,#ff9a3d 2px 3px)}
#legend .lg-lf{border:1.5px solid #2bc4bd;background:#0f2224}
#legend .lg-en{border:1.5px solid #2fbf71;border-radius:50%;background:#0d2a1a}
#legend .lg-wc{border:1.5px solid #8b78ff;background:#211a36}
#legend>span{margin-left:8px}
#legend i{display:inline-flex;gap:2px}
#loading{position:absolute;left:12px;top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:12px}
#sheet{background:var(--surface);border-top:1px solid var(--line);max-height:30%;overflow:auto;padding-block:8px}
#sheet h2{margin:0 0 6px;font-size:16px;font-weight:700;color:var(--accent-hi)}
#steps{margin:0;padding:0;list-style:none;display:grid;gap:2px}
#steps li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:500}
#steps li:hover{background:var(--soft)}
#steps .fl{flex:none;min-width:34px;font-weight:800;color:var(--accent-hi)}
#steps .up{color:var(--muted);cursor:default}
#floors{background:var(--surface);border-top:1px solid var(--line);padding-block:8px;display:flex;gap:6px;align-items:center;overflow-x:auto}
#floors .lab{flex:none;color:var(--muted);font-size:12px;margin-right:2px}
#floors button{flex:none;position:relative;min-width:44px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:700}
#floors button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#floors button.has::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--route);box-shadow:0 0 0 2px var(--card)}
#floors button[aria-pressed="true"].has::after{background:#fff;box-shadow:0 0 0 2px var(--accent)}
#floors button.empty{color:var(--muted);font-weight:400}
@media (prefers-reduced-motion:no-preference){#stage{transition:none}}
</style>

<div id="app">
  <header id="top" class="band">
    <div class="brand"><span class="logo" aria-hidden="true">МГТУ</span><h1>Карта УЛК<small>учебно-лабораторный корпус</small></h1></div>
    <div class="seg" role="group" aria-label="Режим">
      <button id="mView" aria-pressed="true">Маршрут</button>
      <button id="mEdit" aria-pressed="false">Редактор</button>
    </div>
  </header>

  <section id="panel" class="band">
    <div id="viewPanel">
      <div class="fields">
        <div class="field"><label for="inFrom">Откуда</label><input id="inFrom" autocomplete="off" inputmode="text" placeholder="вход или аудитория"></div>
        <button class="ibtn swap" id="swap" title="Поменять местами" aria-label="Поменять местами">⇅</button>
        <div class="field"><label for="inTo">Куда</label><input id="inTo" autocomplete="off" inputmode="text" placeholder="номер аудитории, например 403"></div>
      </div>
      <ul id="sug" role="listbox" hidden></ul>
      <p class="note warn" id="viewNote"></p>
    </div>
    <div id="editPanel" hidden>
      <div id="tools" role="group" aria-label="Инструменты"></div>
      <p class="note" id="hint"></p>
      <div id="editrow">
        <input id="lbl" placeholder="подпись точки" autocomplete="off" hidden>
        <button class="small" id="lblOk" hidden>Готово</button>
        <button class="small" id="newLine" hidden>Новая линия</button>
        <button class="small" id="copyJson">Копировать данные</button>
        <button class="small danger" id="resetFloor">Сбросить этаж</button>
      </div>
      <p class="note" id="status"></p>
      <textarea id="dump" hidden readonly aria-label="Данные разметки"></textarea>
    </div>
  </section>

  <main id="map" aria-label="План этажа">
    <div id="stage"><img id="plan" alt="План этажа" draggable="false"><svg id="vec"></svg><svg id="ov"></svg></div>
    <div id="loading">Загружаю план…</div>
    <div id="legend" aria-hidden="true"><i><span class="lg-st"></span><span class="lg-lf"></span><span class="lg-st"></span></i> лестницы и лифтовый холл <span class="lg-wc"></span> туалет <span class="lg-en"></span> вход</div>
    <div class="zoom">
      <button id="zIn" aria-label="Приблизить">+</button>
      <button id="zOut" aria-label="Отдалить">−</button>
      <button id="zFit" aria-label="Показать весь этаж">⤢</button>
    </div>
  </main>

  <section id="sheet" class="band" hidden>
    <h2>Маршрут</h2>
    <ol id="steps"></ol>
  </section>

  <nav id="floors" class="band" aria-label="Этажи"></nav>
</div>

  recompute(); cur=R?R.floors[R.floors.length-1]:'4'; setFloor(cur); renderFloors();
  $('#viewNote').textContent=$('#viewNote').textContent||'Схема всех этажей, черновая версия. Нажмите на аудиторию на плане, чтобы построить к ней маршрут.';
  $('#viewNote').className='note'+($('#viewNote').textContent.indexOf('Схема')===0?'':' warn');
})();
loadDb();
window.ULK_VIEW=function(x,y,s){var r=map.getBoundingClientRect(); view.s=s; view.tx=r.width/2-x*s; view.ty=r.height/2-y*s; applyView()};
window.ULK_OPEN=function(to,from){
  function one(q){q=String(q).replace(/_/g,'-'); var r=find(q); return r.length?r[0]:null}
  var T=one(to); if(!T) return; var Fm=from?one(from):null;
  if(Fm){sel.from=Fm; $('#inFrom').value=Fm.label}
  sel.to=T; $('#inTo').value=T.label; recompute(); autoShow();
};
})();
</script>
